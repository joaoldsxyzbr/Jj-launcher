name: Publish signed release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão MAJOR.MINOR.PATCH (por exemplo 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jj-launcher-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    environment: release
    env:
      JJ_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate version and configure secure signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JJ_KEYSTORE_BASE64: ${{ secrets.JJ_KEYSTORE_BASE64 }}
          JJ_STORE_PASSWORD: ${{ secrets.JJ_STORE_PASSWORD }}
          JJ_KEY_ALIAS: ${{ secrets.JJ_KEY_ALIAS }}
          JJ_KEY_PASSWORD: ${{ secrets.JJ_KEY_PASSWORD }}
        run: |
          if ! [[ "$JJ_RELEASE_VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::error::Versão inválida (use MAJOR.MINOR.PATCH)"
            exit 1
          fi
          if gh release view "v$JJ_RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::Esta versão já foi publicada"
            exit 1
          fi
          for key in JJ_KEYSTORE_BASE64 JJ_STORE_PASSWORD JJ_KEY_ALIAS JJ_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Configure o segredo $key no ambiente release"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$JJ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jj-release.jks"
          echo "JJ_KEYSTORE_PATH=$RUNNER_TEMP/jj-release.jks" >> "$GITHUB_ENV"
      - name: Run tests and build signed APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
        env:
          JJ_STORE_PASSWORD: ${{ secrets.JJ_STORE_PASSWORD }}
          JJ_KEY_ALIAS: ${{ secrets.JJ_KEY_ALIAS }}
          JJ_KEY_PASSWORD: ${{ secrets.JJ_KEY_PASSWORD }}
      - name: Verify APK signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$JJ_RELEASE_VERSION" \
            "app/build/outputs/apk/release/app-release.apk#jj-launcher-v${JJ_RELEASE_VERSION}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "JJ Launcher v$JJ_RELEASE_VERSION" \
            --generate-notes
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/jj-release.jks"
